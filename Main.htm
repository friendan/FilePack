<vbox id="main">
    <!-- 中间Tab布局区域 -->
    <vbox id="tabContainer" margin="5">
        <!-- TAB标签栏 -->
        <hbox id="tabBar" height="30" margin="0,0,0,2">
            <button
                class="tabbtn"
                id="btnTabLog"
                width="100"
                text="日志"
                margin-left="2"
                margin-right="2"
                visible="false"
            ></button>
            <spacer width="5"></spacer>
            <button
                class="tabbtn"
                id="btnAddTab"
                width="30"
                text="+"
                margin-left="2"
                margin-right="2"
            ></button>
        </hbox>
        <spacer height="5"></spacer>
        <!-- Tab内容区域 -->
        <tablayout id="mainTabs"> </tablayout>
    </vbox>

    <!-- 底部状态栏 -->
    <hbox id="statusbar" height="30" margin="5,0,5,5">
        <button class="btn" id="btnToggleLog" width="40" text="日志"></button>
        <spacer width="5"></spacer>
        <label id="statusLeft" halign="left" text="就绪"></label>
        <spacer></spacer>
        <label
            id="statusRight"
            width="80"
            halign="right"
            margin-right="5"
            text="version 1.0"
        ></label>
    </hbox>
</vbox>

<style>
    /* 主窗口样式 */
    #main {
        background-color: #f5f5f5;
    }

    /* 工具栏样式 */
    #toolbar {
        background-color: #ffffff;
        border: 1px #d0d0d0 solid;
        border-radius: 5px;
    }

    /* 按钮样式 */
    .btn {
        border-radius: 3px;
        border: 1px #c0c0c0 solid;
        background-color: #f0f0f0;
        font-size: 13px;
        color: #333333;
    }
    .btn:hover {
        border-color: #0078d4;
        background-color: #e5f1fb;
    }
    .btn:active {
        background-color: #cce4f7;
    }

    /* TAB标签栏样式 */
    #tabBar {
        background-color: #e8f5e9;
        border-bottom: none;
    }

    /* Tab容器样式 */
    #tabContainer {
        background-color: #ffffff;
        border: 1px #d0d0d0 solid;
        border-radius: 5px;
    }

    /* TAB按钮样式 */
    .tabbtn {
        background-color: #e6e6e6;
        border: 1px solid #d0d0d0;
        border-radius: 3px 3px 0 0;
        font-size: 12px;
        color: #000000;
    }
    .tabbtn:hover {
        background-color: #d2d2d2;
    }
    .tabbtn:active {
        background-color: #b4b4b4;
    }

    /* 选中的TAB按钮 */
    .tabbtn-active {
        background-color: #ffffff;
        border-bottom: 1px solid #ffffff;
        font-size: 12px;
        color: #000000;
    }

    #logBox {
        background-color: #ffffff;

        border: none;
    }

    /* 状态栏样式 */
    #statusbar {
        background-color: #e8e8e8;
        border: 1px #d0d0d0 solid;
        border-radius: 3px;
    }

    #statusLeft,
    #statusCenter,
    #statusRight {
        font-size: 12px;
        color: #333333;
    }

    /* 滚动条样式 */
    #logScrollbar {
        border-radius: 3px;
        background-color: rgba(200, 200, 200, 0.3);

    }
    #logScrollbar:hover {
        fore-color: rgba(100, 100, 100, 0.9);
