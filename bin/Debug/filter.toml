# filter.toml - 文件过滤规则配置
#
# 使用方法：
#   在文件列表中右键打包时，配置的过滤规则会自动排除匹配的文件/文件夹。
#
# 规则匹配说明：
#   1. 区分大小写：区分大小写
#   2. 通配符：支持 * 号（如 *.log, temp*, *test*）
#   3. 精确匹配：直接写路径（如 7z.exe）
#   4. 前缀匹配：路径以规则开头即匹配（如 temp 匹配 temp\sub\file.dll）
#
# 规则分类
#   general：      通用规则，对所有文件夹生效
#   folder."xxx"： 指定文件夹规则，只对文件夹名匹配的生效

[filters]

# ============ 通用规则（所有文件夹都生效） ============

general = [
    # 版本控制
    ".git",
    ".svn",
    ".hg",

    # 系统文件
    "Thumbs.db",
    "desktop.ini",
    ".DS_Store",

    # 日志和临时文件
    "*.log",
    "*.tmp",
    "*.bak",
    "*.swp",

    # 编译输出
    "bin",
    "obj",
    "node_modules",
    "packages",
    ".vs",

    # 配置文件备份
    "*.user",
    "*.suo",
    "*.sdf",
]

# ============ 按文件夹名指定规则 ============

# 示例（把注释去掉即可生效）：
#
# [folder."MyProject"]
# rules = [
#     "README.md",
#     "LICENSE",
#     "docs"
# ]
